[project]
name = "itmo-homework"
version = "0.1.0"
description = "DeepGen homework solutions"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "imageio>=2.37.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pytest>=9.0.3",
    "requests>=2.33.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
